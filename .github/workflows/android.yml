# Назва робочого процесу, яка відображатиметься на вкладці Actions
name: Android CI

# Події, які запускають збірку
on:
  push:
    tags:
      # Запускає збірку лише для тегів, що відповідають версіям (наприклад, v1.0.0)
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Виключає теги, які містять "-RuStore"
      - '!*-RuStore'

# Надаємо права на запис до репозиторію (необхідно для створення релізів)
permissions:
  contents: write

# Змінні середовища, які беруться із секретів (у налаштуваннях GitHub)
env:
  KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
  RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

# Етапи (робочі процеси)
jobs:
  build:
    name: Build APK
    # Використання віртуальної машини з операційною системою Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    # 1. Завантажує вихідний код проекту в робочу директорію
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    # 2. Встановлює необхідну версію Java (JDK 17) для роботи з Android SDK
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: gradle
        
    # 3. Завантажує закритий ключ для підпису додатка з окремого закритого репозиторію
    - name: Checkout keystore repo
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.KEYSTORE_GIT_REPOSITORY }}
        token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
        path: app/keystore
        
    # 4. Надає права доступу на виконання скрипта gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    # 5. Компілює проект за допомогою системи Gradle (створює файли APK та AAB)
    - name: Build with Gradle
      run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease
          
    # 6. Створює реліз на сторінці GitHub Releases та прикріплює готовий APK
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/lite/release/app-lite-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
